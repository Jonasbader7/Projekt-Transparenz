# ----------------------------------------------------------------------------------
# Erste echte Quelle: GLEIF (Rechtsträger-Stammdaten Level 1, Mutter-Tochter Level 2).
# Deaktiviert, bis ein echter Fonds LEIs liefert (Abfrageliste data/gleif/abfrageliste.txt).
# Manuell: python -m transparenz update --source gleif_lei --force
[[source]]
key = "gleif_lei"
name = "GLEIF – LEI-Stammdaten und Konzernbeziehungen (API)"
kind = "entities"
publisher = "Global Legal Entity Identifier Foundation (GLEIF), Basel"
fetcher = "gleif_api"
format = "gleif_json"
location = "https://api.gleif.org/api/v1"
lei_list = "data/gleif/abfrageliste.txt"
interval_hours = 168
max_age_days = 30
license = "CC0 1.0 Universal (laut LEI Data Terms of Use)"
license_url = "https://creativecommons.org/publicdomain/zero/1.0/"
terms_url = "https://www.gleif.org/en/meta/lei-data-terms-of-use"
license_checked_on = 2026-11-07
commercial_use = "ja"
redistribution = "ja"
attribution = "Quelle: GLEIF, LEI-Daten (CC0 1.0), abgerufen über api.gleif.org. Nicht verlangt; wir nennen die Quelle trotzdem. Kein Eindruck einer Billigung durch GLEIF."
is_fictional = false
enabled = false
description = "Bestätigt LEIs (Name, Sitzland, Registrierungsstatus) und liefert gemeldete direkte/oberste Muttergesellschaften. Kein ISIN-LEI-Mapping (eigene Lizenzfrage, ausgeschlossen)."
