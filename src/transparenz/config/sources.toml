# Konfigurierte Datenquellen für das Update-System.
# Aktuell sind AUSSCHLIESSLICH fiktive Beispielquellen aktiv. Echte Quellen werden
# erst nach Lizenzprüfung ergänzt (siehe docs/DATA_SOURCES.md).
#
# kind:     holdings | entities | evidence | coverage
# fetcher:  local (Pfad relativ zum Projektordner) | http (URL)
# format:   json | csv
# commercial_use: ja | nein | unklar

[defaults]
max_attempts = 3
backoff_seconds = 2.0
http_timeout_seconds = 30.0

[[source]]
key = "fiktiv_etf"
name = "Fiktiver ETF «Muster Nachhaltigkeit Welt» – Positionen"
kind = "holdings"
publisher = "Fiktiver ETF-Anbieter (Demo)"
fetcher = "local"
format = "csv"
location = "data/sample/fiktiv_etf_positionen.csv"
interval_hours = 24
max_age_days = 45
license = "Fiktive Demodaten, frei verwendbar"
