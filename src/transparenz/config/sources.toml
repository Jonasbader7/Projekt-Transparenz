# Konfigurierte Datenquellen für das Update-System – mit Lizenzregistrierung je Quelle.
# Aktiv sind ausschliesslich fiktive Beispielquellen. Echte Quellen werden erst nach
# Lizenzprüfung an der Originalseite ergänzt (siehe docs/DATA_SOURCES.md).
#
# kind:     holdings | entities | evidence | coverage
# fetcher:  local (Pfad relativ zum Projektordner) | http (URL) | gleif_api (GLEIF-API)
# format:   json | csv | gleif_json
#
# Lizenzregistrierung (Pflicht für echte Quellen, sonst automatisch GESPERRT –
# siehe src/transparenz/config/licensing.py und tests/test_licensing.py):
#   license            genaue Lizenzbezeichnung laut Originalseite
#   license_url        Lizenztext (falls es einen gibt, z. B. Creative Commons)
#   terms_url          Originalseite mit den Nutzungsbedingungen (Pflicht)
#   license_checked_on Datum unserer Prüfung (Pflicht, höchstens 365 Tage alt)
#   commercial_use     ja | nein | unklar  (Pflicht: ja)
#   redistribution     ja | nein | unklar  (Weiterveröffentlichung, Pflicht: ja)
#   attribution        verlangte oder erbetene Quellenangabe

[defaults]
max_attempts = 3
backoff_seconds = 2.0
http_timeout_seconds = 30.0

[[source]]
key = "fiktiv_etf"
name = "Fiktiver ETF «Muster Nachhaltigkeit Welt» – Positionen"
kind = "holdings"
publisher = "Fiktiver ETF-Anbieter (Demo)"
fetcher = "local"
format = "csv"
location = "data/sample/fiktiv_etf_positionen.csv"
interval_hours = 24
max_age_days = 45
license = "Fiktive Demodaten, frei verwendbar"
commercial_use = "ja"
redistribution = "ja"
is_fictional = true
description = "Klar fiktive Fondspositionen zur Demonstration. Keine realen Unternehmen."

