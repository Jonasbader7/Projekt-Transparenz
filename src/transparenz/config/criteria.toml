# Kriterienmodell «Projekt Transparenz»
#
# Zentrale, versionierte Grundlage für Screening-Engine, Pilot und Website.
# Geladen und geprüft von transparenz.config.catalog (load_criteria_model).
#
# WICHTIG: Die Regeln in dieser Datei sind UNSERE BEWERTUNGSENTSCHEIDUNG (Startprofil),
# keine Aussage einer Quelle. Belege bleiben quellenbasiert («Laut … vom …»); ob ein Beleg
# im Profil als Konflikt zählt, entscheidet allein diese Datei.
#
# Jede inhaltliche Änderung: profile_version erhöhen und in docs/DECISIONS.md begründen.
# Es gibt keine Verrechnung zwischen Kriterien und keinen Gesamtscore.

[model]
schema_version = 2
profile_key = "streng"
profile_name = "Strenges Ausschlussprofil (Startprofil)"
profile_version = "1.1"
decided_on = 2026-11-13
statement = "Die Regeln dieses Profils sind unsere Bewertungsentscheidung. Sie legen fest, welche belegten Sachverhalte als Konflikt mit dem Profil gelten. Die Belege selbst stammen aus den genannten Quellen."

# ---------------------------------------------------------------------------------------
# Belegstufen: gemeinsames Vokabular für alle Kriterien.
# «statuses» verweist auf den Belegstatus der Engine (entities/enums.py, AssessmentStatus).
# ---------------------------------------------------------------------------------------
[[evidence_level]]
key = "kontext_risiko"
name = "Länder- oder Branchenrisiko"
description = "Allgemeines Risiko eines Landes, einer Branche oder eines Rohstoffs. Sagt nichts über ein bestimmtes Unternehmen und ist nie ein Beleg gegen ein Unternehmen."
statuses = []

[[evidence_level]]
key = "verdacht"
name = "Verdacht oder laufende Massnahme"
description = "Vorwurf, laufendes Verfahren, vorsorgliche Behördenmassnahme, Medienbericht oder Recherche ohne abschliessende Feststellung. Wird gezeigt, zählt nicht als bestätigter Verstoss."
statuses = ["verfahren_laufend", "medienbericht", "pruefung_ausstehend"]

[[evidence_level]]
key = "dokumentiert"
name = "Dokumentierter Sachverhalt"
description = "Nachprüfbar dokumentierte Tatsache aus einem Register oder einer Recherche mit Belegen, zum Beispiel eine Beteiligung an einer Anlage oder ein Ausschlussentscheid einer Institution."
statuses = ["dokumentiert"]

[[evidence_level]]
key = "bestaetigt"
name = "Bestätigte Feststellung"
description = "Abschliessende Feststellung eines Gerichts oder einer Behörde, deren Originaldokument wir geprüft haben."
statuses = ["festgestellt"]

# ---------------------------------------------------------------------------------------
# Beziehungstypen zwischen Unternehmen und Anlage (seit Profil 1.1, D-045).
# Eine Besitzkette sagt, wer an wem wie viel hält, aber nicht auf wessen Rechnung. Deshalb
# hat jeder Beziehungstyp seine eigene, offengelegte Regel. «effect» ist unsere
# Bewertungsentscheidung. «data_status» sagt, ob die Regel heute mit Daten verbunden ist.
# ---------------------------------------------------------------------------------------
[[relationship_type]]
key = "own_account"
name = "Eigentum auf eigene Rechnung"
description = "Das Unternehmen besitzt die Anlage selbst, über Tochtergesellschaften oder über eine eigene Beteiligung an einer Projekt- oder Betriebsgesellschaft."
effect = "conflict"
decision = "decided"
reason = "Wer eine Anlage besitzt, trägt ihren wirtschaftlichen Ertrag und ihr Risiko. Nur dieser Beziehungstyp ist eine «Eigentumsbeteiligung» im Sinn der Regeln zu Kohle und fossiler Expansion."
data_status = "integrated"
data_note = "Global Energy Monitor, Energy Ownership Tracker (CC BY 4.0): Besitzketten mit Anteil je Glied."

[[relationship_type]]
key = "financial_stake_unclear"
name = "Finanzbeteiligung eines Finanzinstituts, Rechnung ungeklärt"
description = "Ein Finanzinstitut (Bank, Versicherung, Vermögensverwalter) hält laut Quelle unter 20 % an einer börsenkotierten Gesellschaft. Solche gemeldeten Bestände sind meist Kundenvermögen oder Handelsbestand."
effect = "separate"
decision = "proposed"
reason = "Die Quelle belegt nicht, ob der Bestand eigenes Vermögen ist. Ohne diesen Beleg wäre «Eigentumsbeteiligung» eine Behauptung. Der Bestand wird gesondert gezeigt und löst keinen Konflikt aus, bis eine Quelle die eigene Rechnung belegt."
data_status = "integrated"
data_note = "Erkannt aus der GEM-Besitzkette (Anteil, Börsenkotierung laut GEM) und der Branchenangabe des Unternehmens in Wikidata (CC0). Die Einordnung nennt je Kette ihren Grund."

[[relationship_type]]
key = "asset_management"
name = "Vermögensverwaltung für Kunden oder Fonds"
description = "Die Kette läuft über einen Fonds, eine Fonds- oder Vermögensverwaltungsgesellschaft, eine Pensionskasse oder eine Treuhandgesellschaft. Die Anlagen gehören den Anlegern oder Begünstigten."
effect = "separate"
decision = "decided"
reason = "Ein Anteil an einer Vermögensverwaltungsgesellschaft ist kein anteiliges Eigentum an den Kundenanlagen. Eine mögliche Verantwortung des Verwalters (Stimmrechte, Anlagepolitik) wäre eine eigene Regel mit eigener Schwelle; sie ist nicht festgelegt und deshalb nicht aktiv."
data_status = "integrated"
data_note = "Erkannt an Begriffen im Namen eines Kettenglieds (z. B. «Asset Management», «Fund», «SGR», «Trust Corporation»). Nur Einordnung, nie Zuordnung."

[[relationship_type]]
key = "custody"
name = "Verwahrung von Wertpapieren"
description = "Die Kette läuft über eine Verwahr-, Nominee- oder Treuhandbank, die Wertpapiere für Dritte hält."
effect = "separate"
decision = "decided"
reason = "Eine Verwahrstelle ist im Aktienregister eingetragen, wirtschaftlich berechtigt sind ihre Kunden. Keine Beteiligung."
data_status = "integrated"
data_note = "Erkannt an Begriffen im Namen eines Kettenglieds (z. B. «Nominees», «Custody», «Master Trust Bank»). Nur Einordnung, nie Zuordnung."

[[relationship_type]]
key = "financing"
name = "Kreditvergabe und Projektfinanzierung"
description = "Das Unternehmen finanziert eine Anlage mit einem Kredit, einer Anleihe oder einer Garantie, ohne sie zu besitzen."
effect = "separate"
decision = "proposed"
reason = "Finanzierung ist kein Eigentum. Ob und ab welchem Umfang sie als Konflikt gilt (z. B. Finanzierung neuer Kohlekraftwerke), braucht einen eigenen Entscheid. Bis dahin: gesondert gezeigt, kein Konflikt."
data_status = "mapping_open"
data_note = "GEM Global Coal Project Finance Tracker und Gas Finance Tracker (CC BY 4.0) nennen Geldgeber nur mit Namen, ohne Kennung. Nicht ausgewertet, bis die Namen bestätigt zugeordnet sind."

[[relationship_type]]
key = "operation"
name = "Betrieb einer Anlage"
description = "Das Unternehmen betreibt die Anlage im Tagesgeschäft, mit oder ohne Eigentum."
effect = "separate"
decision = "proposed"
reason = "Vorschlag: Der Betrieb einer Kohleanlage ohne Eigentum wäre als Tätigkeit ein Konflikt. Noch nicht entschieden; heute wird der Betreiber nur bei Anlagen gezeigt, die über Eigentum zugeordnet sind."
data_status = "mapping_open"
data_note = "GEM nennt Betreiber in den Anlagenlisten nur mit Namen. Der Betreiber wird angezeigt, aber kein Unternehmen wird über den Betreibernamen zugeordnet."

[[relationship_type]]
key = "supply_contract"
name = "Stromabnahme und andere Lieferverträge"
description = "Das Unternehmen bezieht Strom oder Brennstoff aus einer Anlage oder beliefert sie, ohne sie zu besitzen oder zu betreiben."
effect = "separate"
decision = "proposed"
reason = "Ein Liefervertrag ist weder Eigentum noch Betrieb. Eine Regel dazu ist nicht festgelegt."
data_status = "no_source"
data_note = "Keine geprüfte Quelle mit Vertragsparteien und Kennung. GEM führt Stromabnehmer nur vereinzelt und nur mit Namen (Gas Finance Tracker)."

# ---------------------------------------------------------------------------------------
# Sanktionen sind kein eigenes Kriterium, sondern Belege mit Sanktionsgrund.
# ---------------------------------------------------------------------------------------
[sanctions]
role = "evidence"
rule = "Eine Sanktionslistung wird als Beleg mit dem amtlichen Sanktionsgrund (Programm, Rechtsgrundlage, Datum) gezeigt und dem Kriterium zugeordnet, zu dem der Grund passt. Passt kein Kriterium, bleibt sie eine Information ohne Konfliktwirkung."
note = "Eine Listung ist eine Behördenmassnahme, kein Gerichtsurteil. Sie wird nie ohne ihren Grund gezeigt."

# ---------------------------------------------------------------------------------------
# Emissionen: vorerst Kennzahlen, kein Ausschlusskriterium.
# ---------------------------------------------------------------------------------------
[[metric]]
key = "treibhausgas_emissionen"
name = "Treibhausgasemissionen"
unit = "t CO2e"
required_fields = ["Jahr", "Scope oder Abgrenzung", "Einheit", "Erhebungsmethode (gemeldet, amtlich verifiziert oder geschätzt)", "Abdeckung (Anlage, Land oder Konzern)", "Quelle mit Stand"]
exclusion_threshold_set = false
rule = "Werte werden mit Jahr, Scope, Einheit, Erhebungsmethode und Abdeckung gezeigt. Werte verschiedener Methoden oder Abdeckungen werden nie addiert."
note = "Ein Ausschlusswert wird erst festgelegt, wenn Vergleichbarkeit und Bewertungsgrundlage tragfähig sind. Ein fehlender Wert heisst nie «keine Emissionen»."

[[metric]]
key = "schadstoff_freisetzungen"
name = "Schadstoff-Freisetzungen und Abfalltransfers"
unit = "je Schadstoff (z. B. kg/a)"
required_fields = ["Jahr", "Schadstoff", "Medium (Luft, Wasser, Boden)", "Einheit", "Standort", "Quelle mit Stand"]
exclusion_threshold_set = false
rule = "Amtlich gemeldete Jahreswerte je Standort. Kein Nachweis eines Rechtsverstosses."
note = "Kein Ausschlusswert festgelegt."

# =======================================================================================
# Aktive Kriterien (zwölf), gruppiert: klima, umwelt, soziales, unternehmensfuehrung
# =======================================================================================

[[criterion]]
key = "kohle"
group = "klima"
name = "Kohle"
status = "active"
basis = "activity"
severity = "hoch"
decision = "decided"
description = "Förderung von Kohle oder Stromerzeugung aus Kohle."
rule = "Jede bestätigte Eigentumsbeteiligung auf eigene Rechnung an aktiver Kohleförderung oder Kohleverstromung gilt im strengen Ausschlussprofil als Konflikt. Vermögensverwaltung, Verwahrung und Finanzierung sind keine Eigentumsbeteiligung und haben eigene Regeln (Beziehungstypen)."
min_own_account_share_percent = 0.0
conflict_statuses = ["festgestellt", "dokumentiert"]
display = ["Beteiligungsanteil in Prozent", "Kontrolle (ab 50 %) ja/nein", "Betreiberrolle", "Status der Anlage (in Betrieb, im Ausbau, stillgelegt)"]
separate = ["Stillgelegte Anlagen: gesondert gezeigt, kein Konflikt", "Verwahrung, Vermögensverwaltung für Kunden und Finanzbeteiligungen von Finanzinstituten mit ungeklärter Rechnung: keine belegte Eigentumsbeteiligung, kein Konflikt", "Beteiligungen mit unbekanntem Anteil: gesondert gezeigt, bis der Anteil belegt ist"]
open_questions = ["Beteiligungsschwelle: heute 0 % (jede bestätigte Beteiligung auf eigene Rechnung). Eine Schwelle wird erst auf der bereinigten Grundlage entschieden; der Pilotbericht zeigt die Wirkung von 5, 10, 20 und 50 %.", "Gelten Kohleprojekte im Ausbau ohne laufenden Betrieb ebenfalls als Konflikt? Heute: ja, als aktive Kohle gezählt.", "Metallurgische Kohle (Stahl) gleich behandeln wie Kraftwerkskohle? Heute: ja."]
sources = ["Global Energy Monitor, Global Energy Ownership Tracker (CC BY 4.0)"]
source_gap = "Umsatzanteil Kohle steht in keiner freigegebenen Quelle."
data_status = "integrated"
metric = "umsatzanteil_kohle"
metric_unit = "%"
threshold_note = "Kein Umsatz-Schwellenwert: Das Profil stellt auf die Beteiligung ab, nicht auf den Umsatzanteil."

  [[criterion.category]]
  key = "kohlefoerderung"
  name = "Kohleförderung (Minen)"
  effect = "conflict"
  decision = "decided"
  reason = "Aktive Förderung, unabhängig von der Höhe der Beteiligung."

  [[criterion.category]]
  key = "kohleverstromung"
  name = "Kohleverstromung (Kraftwerke)"
  effect = "conflict"
  decision = "decided"
  reason = "Aktive Stromerzeugung aus Kohle, unabhängig von der Höhe der Beteiligung."

  [[criterion.category]]
  key = "kohle_stillgelegt"
  name = "Stillgelegte Kohleanlagen"
  effect = "separate"
  decision = "decided"
  reason = "Keine laufende Tätigkeit mehr; wird gezeigt, löst keinen Konflikt aus."

[[criterion]]
key = "fossile_expansion"
group = "klima"
name = "Fossile Expansion"
status = "active"
basis = "activity"
severity = "hoch"
decision = "decided"
description = "Neue fossile Förder-, Transport-, LNG- und Kraftwerkskapazitäten (Öl, Gas, Kohle)."
rule = "Bestätigte neue fossile Förder-, Transport-, LNG- und Kraftwerkskapazitäten werden erfasst. Angekündigte, genehmigte und im Bau befindliche neue Kapazität im Eigentum auf eigene Rechnung gilt im strengen Ausschlussprofil als Konflikt. Vermögensverwaltung, Verwahrung und Finanzierung haben eigene Regeln (Beziehungstypen)."
min_own_account_share_percent = 0.0
conflict_statuses = ["festgestellt", "dokumentiert"]
display = ["Projektphase: Ankündigung, Genehmigung, Bau, Betrieb", "Art der Kapazität: Förderung, Transport (Pipeline), LNG-Terminal, Kraftwerk", "Beteiligungsanteil und Kontrolle"]
separate = ["Reine Instandhaltung oder Ersatz ohne Kapazitätsausbau: gesondert gezeigt, kein Konflikt", "Bestehende Anlagen in Betrieb ohne Ausbau: gezeigt, kein Konflikt unter diesem Kriterium", "Verwahrung, Vermögensverwaltung für Kunden und Finanzbeteiligungen mit ungeklärter Rechnung: kein Konflikt", "Beteiligungen mit unbekanntem Anteil: gesondert gezeigt, bis der Anteil belegt ist"]
open_questions = ["Notstromaggregate und Eigenversorgung (z. B. Dieselgeneratoren von Rechenzentren): Zählen sie als neue fossile Kraftwerkskapazität? Heute: ja, mit dem Vermerk «Eigenbedarf» bzw. «Notstrom» gezeigt.", "Beteiligungsschwelle: heute 0 %; Entscheid erst auf der bereinigten Grundlage.", "Ab welchem Datum gilt eine Anlage als «neu» (Stichtag)? Heute: Projektphase laut Quelle zum Datenstand.", "Zählt eine blosse Ankündigung ohne Genehmigung gleich wie ein Bau? Heute: ja, Phase wird getrennt gezeigt."]
sources = ["Global Energy Monitor, Global Energy Ownership Tracker (CC BY 4.0): Gaskraftwerke, LNG-Terminals, Gas- und Ölpipelines"]
source_gap = "Neue Öl- und Gasfelder: Eigentümer stehen bei GEM nur mit Namen, ohne Kennung. Zuordnung erst über bestätigte Namensentscheide."
data_status = "integrated"
threshold_note = "Kein Schwellenwert: Jede bestätigte neue Kapazität wird erfasst."

  [[criterion.category]]
  key = "foerderung"
  name = "Neue Förderkapazität (Öl- und Gasfelder, Kohleminen)"
  effect = "conflict"
  decision = "decided"

  [[criterion.category]]
  key = "transport"
  name = "Neue Transportkapazität (Pipelines)"
  effect = "conflict"
  decision = "decided"

  [[criterion.category]]
  key = "lng"
  name = "Neue LNG-Terminals (Flüssigerdgas)"
  effect = "conflict"
  decision = "decided"

  [[criterion.category]]
  key = "kraftwerke"
  name = "Neue fossile Kraftwerke"
  effect = "conflict"
  decision = "decided"

  [[criterion.category]]
  key = "instandhaltung"
  name = "Instandhaltung ohne Kapazitätsausbau"
  effect = "separate"
  decision = "decided"
  reason = "Kein Ausbau; wird gesondert gezeigt."

[[criterion]]
key = "waffen"
group = "soziales"
name = "Waffen"
status = "active"
basis = "activity"
severity = "schwer"
decision = "proposed"
description = "Belegte Produktion von Waffen und von wesentlichen, speziell dafür bestimmten Komponenten."
rule = "Belegte Waffenproduktion und wesentliche, speziell dafür bestimmte Komponenten werden erfasst und in vier Kategorien getrennt. Welche Kategorie als Konflikt gilt, steht je Kategorie; diese Ausschlüsse sind ein begründeter Vorschlag und noch zu bestätigen."
conflict_statuses = ["festgestellt", "dokumentiert"]
display = ["Kategorie der Waffe", "Rolle: Hersteller des Waffensystems oder Zulieferer speziell bestimmter Komponenten", "Quelle und Datum des Belegs"]
separate = ["Güter mit doppeltem Verwendungszweck (Dual-Use) ohne belegte Waffenbestimmung: kein Konflikt", "Allgemeine Zulieferer (z. B. Stahl, Standard-Elektronik, Bürosoftware): kein Konflikt", "Handel und Detailhandel mit zivilen Schusswaffen: gesondert gezeigt"]
open_questions = ["Die Ausschlüsse je Kategorie sind ein Vorschlag und brauchen deine Bestätigung.", "Kernwaffen: auch Unternehmen aus Atomwaffenstaaten des Atomwaffensperrvertrags ausschliessen? Vorschlag: ja.", "Konventionelle Waffen: ohne Umsatzdaten keine Schwelle möglich; Vorschlag stellt auf belegte Produktion ab."]
sources = []
source_gap = "Keine Quelle mit bestätigter gewerblicher Freigabe gefunden. Kandidaten: SVVK-ASIR (gewerbliche Nutzung nur nach Registrierung), Norges Bank (nur private, nicht gewerbliche Nutzung)."
data_status = "rights_unclear"
threshold_note = "Kein Umsatz-Schwellenwert vorgesehen."

  [[criterion.category]]
  key = "geaechtete_waffen"
  name = "Geächtete Waffen"
  description = "Streumunition, Antipersonenminen, biologische und chemische Waffen."
  effect = "conflict"
  decision = "proposed"
  reason = "International geächtet (Übereinkommen über Streumunition, Ottawa-Konvention, Bio- und Chemiewaffenübereinkommen). Das Schweizer Kriegsmaterialgesetz verbietet ihre Finanzierung. Vorschlag: Null-Toleranz, auch für speziell bestimmte Komponenten."

  [[criterion.category]]
  key = "kernwaffen"
  name = "Kernwaffen"
  description = "Entwicklung, Herstellung oder Wartung von Kernwaffen und speziell dafür bestimmten Komponenten."
  effect = "conflict"
  decision = "proposed"
  reason = "Massenvernichtungswaffe; im Schweizer Kriegsmaterialgesetz als verbotenes Kriegsmaterial geführt. Vorschlag: Null-Toleranz. Ob das Sitzland Atomwaffenstaat des Sperrvertrags ist, wird getrennt gezeigt."

  [[criterion.category]]
  key = "konventionelle_waffen"
  name = "Konventionelle militärische Waffen"
  description = "Waffensysteme, Munition und speziell dafür bestimmte wesentliche Komponenten für Streitkräfte."
  effect = "conflict"
  decision = "proposed"
  reason = "Ein strenges Profil soll keine Rüstungsproduktion mitfinanzieren. Weil Umsatzanteile fehlen, stellt der Vorschlag auf belegte Produktion ab, nicht auf eine Schwelle. Wer das zu streng findet, braucht ein zweites, milderes Profil."

  [[criterion.category]]
  key = "zivile_schusswaffen"
  name = "Zivile Schusswaffen"
  description = "Herstellung von Schusswaffen und Munition für den zivilen Markt."
  effect = "conflict"
  decision = "proposed"
  reason = "Vorschlag: Hersteller als Konflikt, Handel nur gesondert zeigen. Der Handel ist oft ein kleiner Nebenumsatz grosser Detailhändler und ohne Umsatzdaten nicht fair bewertbar."

  [[criterion.category]]
  key = "handel_zivile_schusswaffen"
  name = "Handel mit zivilen Schusswaffen"
  description = "Gross- und Detailhandel mit Schusswaffen und Munition für den zivilen Markt, ohne eigene Herstellung."
  effect = "separate"
  decision = "proposed"
  reason = "Gesondert gezeigt; ohne Umsatzdaten nicht fair bewertbar."

  [[criterion.category]]
  key = "dual_use"
  name = "Güter mit doppeltem Verwendungszweck ohne belegte Waffenbestimmung"
  description = "Dual-Use-Güter, allgemeine Zulieferungen (Stahl, Standardelektronik, Software) ohne Beleg, dass sie speziell für Waffen bestimmt sind."
  effect = "separate"
  decision = "decided"
  reason = "Keine belegte Waffenproduktion; wird gezeigt, löst keinen Konflikt aus."

[[criterion]]
key = "zwangs_kinderarbeit"
group = "soziales"
name = "Zwangs- und Kinderarbeit"
status = "active"
basis = "conduct"
severity = "schwer"
decision = "decided"
description = "Zwangsarbeit oder ausbeuterische Kinderarbeit im eigenen Betrieb oder in der Lieferkette."
rule = "Bestätigte Verstösse gelten als Konflikt. Allgemeine Länder- und Branchenrisiken, Verdachtsmassnahmen und bestätigte Feststellungen werden unterschieden."
conflict_statuses = ["festgestellt"]
display = ["Belegstufe: Länder-/Branchenrisiko, Verdachtsmassnahme oder bestätigte Feststellung", "Eigene Tätigkeit oder Lieferkette", "Behörde, Datum und Verfahrensstand"]
separate = ["Länder- und Branchenrisiken: nur Kontext, nie Beleg gegen ein Unternehmen", "Verdachtsmassnahmen (z. B. Einfuhrsperre vor einer Feststellung): gezeigt, kein Konflikt", "Rechtmässige Beschäftigung Jugendlicher nach dem Recht des Landes und den ILO-Übereinkommen 138 und 182: keine Kinderarbeit im Sinn dieses Kriteriums"]
open_questions = ["Wie tief in der Lieferkette zählt ein bestätigter Verstoss (direkter Zulieferer, weitere Stufen)?", "Wie lange wirkt ein bestätigter Verstoss nach belegter Abhilfe?"]
sources = []
source_gap = "US-Behördenlisten (Einfuhrsperren, UFLPA) sind gemeinfrei, nennen Unternehmen aber nur mit Namen und sind Verdachts- bzw. Verwaltungsmassnahmen. Zuordnung erst über bestätigte Namensentscheide."
data_status = "mapping_open"
threshold_note = "Kein Schwellenwert: Jeder bestätigte Verstoss zählt."

  [[criterion.category]]
  key = "zwangsarbeit"
  name = "Zwangsarbeit"
  effect = "conflict"
  decision = "decided"

  [[criterion.category]]
  key = "kinderarbeit"
  name = "Ausbeuterische Kinderarbeit"
  effect = "conflict"
  decision = "decided"

  [[criterion.category]]
  key = "jugendbeschaeftigung"
  name = "Rechtmässige Beschäftigung Jugendlicher"
  effect = "separate"
  decision = "decided"
  reason = "Erlaubte Arbeit Jugendlicher ist keine Kinderarbeit."

[[criterion]]
key = "entwaldung"
group = "umwelt"
name = "Entwaldung"
status = "active"
basis = "conduct"
severity = "hoch"
decision = "decided"
description = "Umwandlung von Wald oder anderen natürlichen Ökosystemen durch eigene Tätigkeit oder in der Lieferkette (z. B. Soja, Palmöl, Rind, Kakao, Holz)."
rule = "Nachgewiesene Waldumwandlung mit belegtem Unternehmens- oder Lieferkettenbezug wird erfasst. Satellitensignale allein reichen nicht zur Verantwortungszuweisung. Direkte Tätigkeit und Lieferkettenbezug werden getrennt bewertet."
conflict_statuses = ["festgestellt"]
display = ["Direkte Tätigkeit oder Lieferkettenbezug", "Rohstoff und Region", "Art des Nachweises (Behördenentscheid, Gerichtsurteil, dokumentierte Recherche)"]
separate = ["Satellitensignale ohne belegten Unternehmensbezug: kein Beleg", "Lieferkettenbezug ohne bestätigte Feststellung: gezeigt, kein Konflikt", "Dokumentierte Recherchen ohne Behördenentscheid: gezeigt, kein Konflikt"]
open_questions = ["Stichtag (z. B. 31.12.2020 wie in der EU-Entwaldungsverordnung)?", "Gilt ein bestätigter Lieferkettenbezug gleich wie eine direkte Tätigkeit? Heute: getrennt gezeigt, nur die direkte Tätigkeit ist Konflikt."]
sources = []
source_gap = "Forest 500 nur nicht-kommerziell; Trase nur auf Anfrage; brasilianische Behördendaten (IBAMA) technisch nicht lesbar und Lizenz ungeprüft."
data_status = "no_source"
threshold_note = "Kein Schwellenwert."

  [[criterion.category]]
  key = "direkte_taetigkeit"
  name = "Direkte Tätigkeit"
  effect = "conflict"
