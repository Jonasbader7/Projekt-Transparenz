[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transparenz"
version = "0.1.0"
description = "Transparenz für nachhaltige Geldanlagen: belegbasiertes Screening von ETF-Positionen (Arbeitstitel «Projekt Transparenz»)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jonas Bader" }]
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "streamlit>=1.40",
    "jinja2>=3.1",  # für farbige Tabellen (pandas Styler)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
transparenz = "transparenz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transparenz = ["config/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # deutsche Typografie («», –) ist gewollt

[tool.ruff.lint.isort]
known-first-party = ["transparenz"]
known-local-folder = ["conftest", "ui"]
